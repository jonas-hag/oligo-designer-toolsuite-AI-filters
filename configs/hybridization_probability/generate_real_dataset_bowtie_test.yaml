dir_output : data/hybridization_probability/datasets_test # path to the folder where the dataset will be stored
oligo_length_min: 15  # minimum length of the oligos
oligo_length_max: 100  # maximum length of the oligos
splits_size: [0.5, 0.25, 0.25]  # train , validation and test splits
file_genes: data/hybridization_probability/regions/custom_12.csv  # path to the file containing the desired genes
dataset_size: 100000 # total number of entries of the dataset
oligos_per_region: 1000 # maximun number of oligo per region for which the off targets are searched
n_jobs: 8  # number of available CPUs (if None the maximum number of CPUs will be used)
seed: 547389
nupack_cache: 8.0

######### only for custom source ##########
source: custom # required: indicate that own annotation should be used
source_params:
    file_annotation: data/hybridization_probability/output_genomic_region_generator_ncbi/annotation/GCF_000001405.40_GRCh38.p14_genomic.gtf # required: GTF file with gene annotation
    file_sequence: data/hybridization_probability/output_genomic_region_generator_ncbi/annotation/GCF_000001405.40_GRCh38.p14_genomic.fna # required: FASTA file with genome sequence
    files_source: NCBI # optional: original source of the genomic files
    species: Homo_sapiens # optional: species of provid ed annotation, leave empty if unknown
    taxon: vertebrate_mammalian # optional: taxon of the species we are intereste, only for source: ncbi
    annotation_release: 110 # optional: release number of provided annotation, leave empty if unknown
    genome_assembly: GRCh38  # optional: genome assembly of provided annotation, leave empty if unknown
genomic_regions:
  gene: true
  exon: false
  exon_exon_junction: false
  cds: false
  intron: false
  intergenic: true

######### alignment method ##########
alignment_method: bowtie
search_parameters:
  -v: 3
hit_parameters:
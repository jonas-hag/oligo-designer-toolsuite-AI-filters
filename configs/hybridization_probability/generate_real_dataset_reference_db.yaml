dir_output : data/hybridization_probability/datasets/reference_db # path to the folder where the dataset will be stored

source: custom # required: indicate that own annotation should be used
source_params:
    file_annotation: data/hybridization_probability/output_genomic_region_generator_ncbi_for_hpc/annotation/GCF_000001405.40_GRCh38.p14_genomic.gtf # data/hybridization_probability/output_genomic_region_generator_ncbi/annotation/GCF_000001405.40_GRCh38.p14_genomic.gtf # required: GTF file with gene annotation
    file_sequence: data/hybridization_probability/output_genomic_region_generator_ncbi_for_hpc/annotation/GCF_000001405.40_GRCh38.p14_genomic.fna # data/hybridization_probability/output_genomic_region_generator_ncbi/annotation/GCF_000001405.40_GRCh38.p14_genomic.fna # required: FASTA file with genome sequence
    files_source: NCBI # optional: original source of the genomic files
    species: Homo_sapiens # optional: species of provid ed annotation, leave empty if unknown
    taxon: vertebrate_mammalian # optional: taxon of the species we are intereste, only for source: ncbi
    annotation_release: GCF_000001405.40-RS_2025_08 # optional: release number of provided annotation, leave empty if unknown
    genome_assembly: # optional: genome assembly of provided annotation, leave empty if unknown
genomic_regions:
  gene: true
  exon: false
  exon_exon_junction: false
  cds: false
  intron: false
  intergenic: true